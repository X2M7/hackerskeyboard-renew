apply plugin: 'com.android.application'

android {
    namespace 'org.pocketworkstation.pckeyboard'
    compileSdk 35

    defaultConfig {
        applicationId 'org.pocketworkstation.pckeyboard'
        minSdk 23
        targetSdk 35
        versionCode 2000002
        versionName "v2.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    ndkVersion "27.0.12077973"
    productFlavors {
    }
    bundle {
        language {
            // The app switches between all bundled keyboard locales at runtime.
            enableSplit = false
        }
    }
    lint {
        checkReleaseBuilds true
        abortOnError true
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //noinspection GradleDependency -- 1.17+ requires a newer compile SDK/AGP toolchain.
    implementation "androidx.core:core:1.16.0"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
